services:
  backend:
    build: ./backend
    ports:
      - "${OPSRADAR_BACKEND_PORT:-8000}:8000"
    environment:
      OPSRADAR_DATABASE_URL: sqlite:////data/opsradar.db
      OPSRADAR_SEED_DEMO: "true"
    volumes:
      - opsradar-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "${OPSRADAR_FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  opsradar-data:
